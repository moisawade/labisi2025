name: CI Docker Débutant

on:
  push:
    branches:
      - lab1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérifier les fichiers
        run: ls -la

      - name: Construire l’image Docker
        run: docker build -t devops-ci-demo .
